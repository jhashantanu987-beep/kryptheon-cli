<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="kryptheon-token" content="%%TOKEN%%">
<meta name="color-scheme" content="dark light">
<title>Kryptheon</title>
<style>
  :root {
    --bg: #07090e;
    --bg-glow-1: rgba(124, 92, 255, 0.16);
    --bg-glow-2: rgba(34, 211, 238, 0.10);
    --surface: rgba(255, 255, 255, 0.035);
    --surface-2: rgba(255, 255, 255, 0.06);
    --surface-solid: #0e1118;
    --line: rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.14);
    --ink: #eceef5;
    --muted: #8a90a2;
    --faint: #5c6273;
    --accent-1: #7c5cff;
    --accent-2: #22d3ee;
    --crit: #ff4d6d;
    --high: #ff8a3d;
    --med: #f5b83d;
    --low: #8a90a2;
    --ok: #2dd4a0;
    --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 20px 40px -24px rgba(0, 0, 0, 0.8);
    --radius: 16px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6fb;
      --bg-glow-1: rgba(124, 92, 255, 0.10);
      --bg-glow-2: rgba(34, 211, 238, 0.10);
      --surface: rgba(255, 255, 255, 0.78);
      --surface-2: #f0f1f7;
      --surface-solid: #ffffff;
      --line: #e4e6ef;
      --line-strong: #d3d6e3;
      --ink: #10131f;
      --muted: #5a6175;
      --faint: #8c92a6;
      --crit: #e11d48;
      --high: #ea580c;
      --med: #b7791f;
      --low: #64748b;
      --ok: #059669;
      --shadow: 0 1px 2px rgba(16, 19, 31, 0.04), 0 16px 32px -24px rgba(16, 19, 31, 0.25);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font: 14px/1.55 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(900px 500px at 10% -10%, var(--bg-glow-1), transparent 60%),
      radial-gradient(700px 400px at 100% 0%, var(--bg-glow-2), transparent 55%),
      var(--bg);
    background-attachment: fixed;
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 22px 24px 60px; }
  @media (max-width: 700px) { .wrap { padding: 14px 16px 40px; } }

  /* Top bar */
  .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    box-shadow: 0 8px 24px -8px rgba(124, 92, 255, 0.7);
  }
  .brand-name { font-weight: 700; letter-spacing: -0.01em; font-size: 16px; }
  .brand-sub { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .top .grow { flex: 1; min-width: 0; }
  .live {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px;
    backdrop-filter: blur(8px);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(45, 212, 160, 0.6); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(45, 212, 160, 0.55); } 70% { box-shadow: 0 0 0 8px rgba(45, 212, 160, 0); } 100% { box-shadow: 0 0 0 0 rgba(45, 212, 160, 0); } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } * { transition: none !important; } }

  /* Hero */
  .hero {
    margin-top: 18px; border-radius: 20px; padding: 26px 28px; position: relative; overflow: hidden;
    border: 1px solid var(--line-strong); background: var(--surface); box-shadow: var(--shadow); backdrop-filter: blur(10px);
  }
  .hero::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.9;
    background: radial-gradient(600px 220px at 0% 0%, var(--hero-glow, rgba(45, 212, 160, 0.18)), transparent 70%);
  }
  .hero.broken { --hero-glow: rgba(255, 77, 109, 0.22); }
  .hero.look { --hero-glow: rgba(245, 184, 61, 0.20); }
  .hero-row { position: relative; display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .hero-icon { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); }
  .hero-title { font-size: 28px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.15; }
  .hero-sub { color: var(--muted); margin-top: 4px; max-width: 760px; }
  .hero .verify { position: relative; margin-top: 16px; display: inline-flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 999px; padding: 5px 12px; }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
  @media (max-width: 1000px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); backdrop-filter: blur(8px); transition: transform .15s ease, border-color .15s ease; }
  .kpi:hover { transform: translateY(-1px); border-color: var(--line-strong); }
  .kpi .k-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
  .kpi .k-num { font-size: 26px; font-weight: 750; letter-spacing: -0.02em; margin-top: 6px; }

  /* Layout */
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; margin-top: 16px; align-items: start; }
  @media (max-width: 1080px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .col { display: grid; gap: 16px; min-width: 0; }
  .card { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); backdrop-filter: blur(10px); min-width: 0; }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .card-title { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .card-head .grow { flex: 1; }
  .count { font-size: 12px; color: var(--faint); }

  /* Chips & pills */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font: inherit; font-size: 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 11px; cursor: pointer; transition: all .15s ease; }
  .chip:hover { color: var(--ink); border-color: var(--line-strong); }
  .chip.on { color: var(--ink); background: var(--surface-2); border-color: var(--line-strong); }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 650; letter-spacing: .02em; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill.sev-CRITICAL, .pill.sev-HIGHCRITICAL { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 45%, transparent); background: color-mix(in srgb, var(--crit) 12%, transparent); }
  .pill.sev-HIGH { color: var(--high); border-color: color-mix(in srgb, var(--high) 45%, transparent); background: color-mix(in srgb, var(--high) 12%, transparent); }
  .pill.sev-MEDIUM { color: var(--med); border-color: color-mix(in srgb, var(--med) 45%, transparent); background: color-mix(in srgb, var(--med) 12%, transparent); }
  .pill.sev-LOW { color: var(--low); }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .pill.bad { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 45%, transparent); }
  .pill.warn { color: var(--med); border-color: color-mix(in srgb, var(--med) 45%, transparent); }
  .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }

  /* Findings */
  .finding { position: relative; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 14px 20px; background: var(--surface-solid); margin-top: 10px; overflow: hidden; transition: border-color .15s ease; }
  .finding:first-child { margin-top: 0; }
  .finding:hover { border-color: var(--line-strong); }
  .finding::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--stripe, var(--low)); }
  .finding.s-CRITICAL, .finding.s-HIGHCRITICAL { --stripe: var(--crit); }
  .finding.s-HIGH { --stripe: var(--high); }
  .finding.s-MEDIUM { --stripe: var(--med); }
  .f-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .f-head { font-weight: 650; font-size: 15px; margin-top: 8px; letter-spacing: -0.005em; }
  .f-where { color: var(--muted); font-size: 12px; margin-top: 3px; overflow-wrap: anywhere; }
  .f-detail { font-size: 13px; color: var(--muted); margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); overflow-wrap: anywhere; }
  .f-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .conf { display: inline-flex; gap: 3px; align-items: center; }
  .conf i { width: 5px; height: 10px; border-radius: 2px; background: var(--line-strong); display: inline-block; }
  .conf i.on { background: var(--accent-2); }
  .idchip { font-size: 11px; color: var(--faint); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; cursor: pointer; background: transparent; }
  .idchip:hover { color: var(--ink); }
  details.prompt { margin-top: 10px; }
  details.prompt summary { cursor: pointer; color: var(--accent-2); font-size: 13px; font-weight: 600; list-style: none; }
  details.prompt summary::-webkit-details-marker { display: none; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.55 ui-monospace, "Cascadia Code", Consolas, monospace; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 8px 0 0; color: var(--ink); }
  .attempts { margin-top: 10px; display: grid; gap: 4px; }
  .attempt { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }

  /* Buttons */
  .btn { font: inherit; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; border-radius: 9px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink); transition: all .15s ease; }
  .btn:hover:not(:disabled) { border-color: var(--accent-1); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.primary { border: 0; color: #fff; background: linear-gradient(135deg, var(--accent-1), #5b8cff); box-shadow: 0 8px 20px -10px rgba(124, 92, 255, .8); }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
  .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .35); border-top-color: #fff; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  button:focus-visible, .chip:focus-visible, input:focus-visible + .track { outline: 2px solid var(--accent-2); outline-offset: 2px; }

  /* Checks */
  .check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
  .check:first-child { border-top: 0; padding-top: 0; }
  .check .c-name { font-weight: 600; font-size: 13.5px; }
  .check .c-state { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .check .c-what { font-size: 12px; color: var(--faint); margin-top: 4px; }
  .check.na .c-name { color: var(--faint); }
  .sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); display: inline-block; }
  .sdot.ok { background: var(--ok); } .sdot.bad { background: var(--crit); } .sdot.warn { background: var(--med); }
  .switch { position: relative; flex: none; width: 38px; height: 22px; margin-top: 1px; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
  .switch input:disabled { cursor: not-allowed; }
  .track { position: absolute; inset: 0; border-radius: 999px; background: var(--line-strong); transition: background .2s ease; }
  .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); transition: transform .2s ease; }
  .switch input:checked + .track { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); }
  .switch input:checked + .track::after { transform: translateX(16px); }
  .switch input:disabled + .track { opacity: .4; }

  /* Timeline */
  .timeline { position: relative; padding-left: 20px; }
  .timeline::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--line); border-radius: 2px; }
  .tl { position: relative; padding: 0 0 16px 0; }
  .tl:last-child { padding-bottom: 0; }
  .tl::before { content: ""; position: absolute; left: -19px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface-solid); border: 2px solid var(--tl, var(--accent-1)); }
  .tl.bad { --tl: var(--crit); } .tl.ok { --tl: var(--ok); }
  .tl-head { font-weight: 600; font-size: 13.5px; }
  .tl-meta { font-size: 12px; color: var(--muted); }
  .tl-files { margin-top: 6px; display: grid; gap: 2px; }
  .tl-file { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .tl-checks { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }

  /* Runs chart */
  .bars { display: flex; align-items: flex-end; gap: 5px; height: 64px; margin-bottom: 12px; }
  .bar { flex: 1; min-width: 6px; border-radius: 4px 4px 2px 2px; background: color-mix(in srgb, var(--ok) 80%, transparent); position: relative; }
  .bar.bad { background: color-mix(in srgb, var(--crit) 85%, transparent); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  td, th { text-align: left; padding: 7px 4px; border-top: 1px solid var(--line); }
  th { color: var(--faint); font-weight: 600; border-top: 0; font-size: 12px; }

  .empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
  .note { color: var(--muted); font-size: 12.5px; }
  .error { color: var(--crit); font-size: 12.5px; margin-top: 10px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--surface-solid); border: 1px solid var(--line-strong); color: var(--ink); border-radius: 12px; padding: 10px 16px; font-size: 13px; box-shadow: var(--shadow); transition: all .25s ease; pointer-events: none; z-index: 10; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="mark" id="mark"></div>
      <div>
        <div class="brand-name" id="title">Kryptheon</div>
        <div class="brand-sub" id="where">Loading...</div>
      </div>
    </div>
    <div class="grow"></div>
    <div class="live"><span class="dot"></span><span id="live">Watching for changes</span></div>
  </div>

  <section class="hero" id="hero">
    <div class="hero-row">
      <div class="hero-icon" id="heroIcon"></div>
      <div>
        <div class="hero-title" id="heroTitle">Reading your project...</div>
        <div class="hero-sub" id="heroSub"></div>
      </div>
    </div>
    <div class="verify" id="verification"></div>
  </section>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="col">
      <section class="card">
        <div class="card-head">
          <div class="card-title">Findings</div>
          <span class="count" id="findingCount"></span>
          <div class="grow"></div>
          <div class="chips" id="filters"></div>
        </div>
        <div id="findings"></div>
      </section>
      <section class="card" id="provenCard" hidden>
        <div class="card-head"><div class="card-title">Proven fixes</div><span class="count" id="provenCount"></span></div>
        <div id="proven"></div>
      </section>
      <section class="card">
        <div class="card-head"><div class="card-title">What changed</div></div>
        <div id="changes"></div>
      </section>
    </div>
    <div class="col">
      <section class="card">
        <div class="card-head"><div class="card-title">Checks</div></div>
        <div id="checks"></div>
        <p class="error" id="checkError" hidden></p>
      </section>
      <section class="card">
        <div class="card-head"><div class="card-title">Runs</div></div>
        <div id="runs"></div>
      </section>
      <section class="card">
        <div class="card-head"><div class="card-title">Where this lives</div></div>
        <p class="note" id="storeNote"></p>
      </section>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/dashboard.js"></script>
</body>
</html>
